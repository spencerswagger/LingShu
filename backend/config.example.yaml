server:
  addr: ":8080"
  static_dir: ""
database:
  dsn: "postgres://llmgw:llmgw@127.0.0.1:5432/llmgw?sslmode=disable"
jwt:
  private_key_path: "keys/jwt_rsa"
  public_key_path: "keys/jwt_rsa.pub"
  ttl_minutes: 720
security:
  # SM4 渠道凭据加密密钥，必须为 32 个 hex 字符（16 字节）。服务启动时若缺失或非法会直接退出。
  # 下方为本地开发默认值（0123456789abcdef，仅限本地）；生产环境务必改为强随机密钥：
  #   openssl rand -hex 16
  sm4_key: "0123456789abcdef0123456789abcdef"
sync:
  price_source_url: "https://models.dev/api.json"
  interval_minutes: 60
billing:
  # 账单落库失败时的本地持久重试队列（WAL）。数据库抖动不会丢账单：
  # 失败记录先落本文件，后台按 retry_interval_seconds 周期重投；
  # billing_id 唯一索引保证重投幂等。留空则关闭该兜底（落库失败仅告警）。
  retry_queue_path: "data/billing_retry.jsonl"
  retry_interval_seconds: 30