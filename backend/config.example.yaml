server:
  addr: ":8080"
  static_dir: ""
database:
  dsn: "postgres://llmgw:llmgw@127.0.0.1:5432/llmgw?sslmode=disable&timezone=Asia/Shanghai"
jwt:
  private_key_path: "keys/jwt_rsa"
  public_key_path: "keys/jwt_rsa.pub"
  ttl_minutes: 360
security:
  # SM4 渠道凭据加密密钥，必须为 32 个 hex 字符（16 字节）。
  # 留空/删除本行时，服务启动时自动从 keys/sm4.key 读取；文件不存在则生成强随机密钥
  # 写入该文件（chmod 600，目录缺失先创建），后续重启复用。生产环境建议显式配置强随机密钥：
  #   openssl rand -hex 16
  # sm4_key: ""
  # 可信代理网段（逗号分隔 CIDR）由环境变量 TRUSTED_PROXY_CIDRS 提供，不在此文件配置。
  # 仅当直连对端属于这些网段时才采信 X-Real-IP（用于登录限流与审计 IP）。
  # 代码默认只信任回环（127.0.0.0/8、::1）；容器部署时需显式声明代理网段，例如：
  #   TRUSTED_PROXY_CIDRS=172.16.0.0/12
sync:
  price_source_url: "https://models.dev/api.json"
  interval_minutes: 60
billing:
  # 账单落库失败时的本地持久重试队列（WAL）。数据库抖动不会丢账单：
  # 失败记录先落本文件，后台按 retry_interval_seconds 周期重投；
  # billing_id 唯一索引保证重投幂等。留空则关闭该兜底（落库失败仅告警）。
  retry_queue_path: "data/billing_retry.jsonl"
  retry_interval_seconds: 30