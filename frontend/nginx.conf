# 单端口入口：静态前端 + /api、/v1 反代至后端，对外仅暴露本服务端口。
#
# 反代目标用变量 + Docker 内置 DNS（127.0.0.11）在运行时解析：
# 这样后端容器重建（docker compose up -d）换了 IP 后 nginx 也能自动跟随，
# 无需重启 web 容器。

# limit_req_zone 仅允许在 http 上下文（conf.d 文件被 include 进 http 块，
# 故置于 server 之外）。
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=captcha:10m rate=20r/m;

# Codex WS（/v1/responses，终表 #2/#9）：升级握手头由客户端 Upgrade 决定——
# 有 Upgrade 头时向上游带 Connection: upgrade；普通请求取 close，不向上游长占连接。
# map 是 http 级指令（与 limit_req_zone 同级），变量名全局唯一（00-magpie-key.conf 无撞车）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 前置反代时采信真实客户端 IP：本项目常被上一层入口（宿主机 nginx 等，多服务共用
# 端口、按 server_name 分流）反代，该层会把客户端 IP 放进 X-Real-IP。此处仅对可信
# 来源采信该头并覆盖 $remote_addr，下方各 location 的 `X-Real-IP $remote_addr`
# 因此携带真实客户端 IP（审计 / 限流才准确）；直连（无该头）时回退对端地址，无回归。
# 可信来源取 compose 自身已声明的同一网段（TRUSTED_PROXY_CIDRS 默认 172.16.0.0/12）
# 加回环；如实际 Docker 网络落在其它段（`docker network inspect <项目名>_default`
# 查网关），需同步修正本段，否则该头不被采信、审计 IP 会退化为对端地址。
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.0/8;
real_ip_header X-Real-IP;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # 跳转一律发相对地址（Location: /magpie/…）。本服务常被外层反代/自定义域名包着，
    # 拼绝对地址会带上容器内部看到的 host:port，跳过去就 404。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    client_max_body_size 50m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 120s;
    send_timeout 60s;

    # 代理侧（magpie）管理面：容器内 3430 是 `magpie web` 的页面端口（同时也是它应答 /v1
    # 的那个端口）。3425 只有网关 API，反代它拿不到页面。变量化 + Docker 内置 DNS，
    # 容器重建换 IP 后不用重启 nginx。
    set $magpie_page magpie:3430;
    # V3：/v1 直连代理侧网关端口（不再经过灵枢）
    set $magpie_gw magpie:3425;

    # 通用安全响应头（add_header 不继承，每个 location 需独立声明）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 管理/开发端 API
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 登录（边缘粗粒度限流）
    location = /api/v1/auth/login {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;

        limit_req zone=login burst=5 nodelay;

        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 开发者自助注册（公开接口，边缘粗粒度限流，与登录同档）
    location = /api/v1/auth/register {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;

        limit_req zone=register burst=5 nodelay;

        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 图形验证码（公开接口，边缘节流，允许少量刷新）
    location = /api/v1/auth/captcha {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-store" always;

        limit_req zone=captcha burst=10 nodelay;

        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- /v1 白名单（定案③ 2026-11-20）：四协议推理 + /v1/models + Codex WS，其余一律 404 ----
    # 放行点位与 docs/designs/2026-11-20-nginx-whitelist-and-header-strip-window.md §5.2 逐字一致；
    # 公共转发/剥头段 = v1-proxy.inc（一份 include，剥头只在响应出口做、请求头零改动）。
    # 匹配序：精确（=）先于正则（~），正则先于前缀 /v1/——兜底 404 只接白名单外流量。
    location = /v1/chat/completions { include /etc/nginx/conf.d/v1-proxy.inc; }

    location ~ ^/v1/responses$ {
        include /etc/nginx/conf.d/v1-proxy.inc;
        # Codex WS 升级头只加在本点位；非升级请求经 map 得 Connection: close，同段安全。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Anthropic Messages + count_tokens（点位 A）：同段正则，不计费不落账本行。
    location ~ ^/v1/messages(/count_tokens)?$ { include /etc/nginx/conf.d/v1-proxy.inc; }

    # Gemini 三方法（含 countTokens 点位 B）；/v1 与 /v1beta 变体同段放行（?:beta)?）。
    location ~ ^/v1(?:beta)?/models/[^/]+:(generateContent|streamGenerateContent|countTokens)$ {
        include /etc/nginx/conf.d/v1-proxy.inc;
    }

    # 模型清单：SDK 启动探测，只列可用模型、无管理信息泄露面。
    location = /v1/models { include /etc/nginx/conf.d/v1-proxy.inc; }

    # 白名单兜底：其余一切 /v1/*（含 /v1/magpie/* 管理面、embeddings、rerank、audio、
    # legacy completions、任何带尾巴变体）一律 404；nginx 自产错误体，不带内部实现信息。
    location /v1/ { return 404; }

    # Gemini 族同款兜底：/v1beta 前缀不在 /v1/ 内，正则只放行三方法；其余路径
    # （embedContent 等未售卖方法、乱尾变体）若不显式 404 会落到静态资源兜底返 200 HTML。
    location /v1beta/ { return 404; }

    # ---- 代理侧（magpie）管理面：/magpie/ 子路径反代（管理员一键跳转的落点）----
    #
    # 访问链路（细节见 docs/designs/2026-11-18-magpie-compose-and-admin-jump.md）：
    #   1. 管理员在灵枢「系统」页点按钮 → POST /api/v1/admin/ops/magpie-access
    #      → 后端校验会话是 ADMIN，签发票据并种 **HttpOnly cookie** `magpie_gate`（Path=/magpie/）
    #   2. 前端 window.open('/magpie/') → 这里先 auth_request 回灵枢验签，验不过 403
    #   3. 验过且浏览器还没有 magpie 自己的页面 cookie 时，把页面口令（MAGPIE_WEB_KEY）
    #      拼进**上游** URL（`$magpie_entry_qs`，由 00-magpie-key.conf 提供）；
    #      magpie 收到后换成它自己的 cookie 并重定向（真机实测 303，旧版是 302），浏览器地址栏里永远没有 key
    #
    # 为什么必须 auth_request：magpie 页面自己的口令是「知道即拥有」的长期凭据，直接给
    # 浏览器看等于绕过灵枢的角色体系；这里用一张 8 小时、可按用户吊销（换密钥）的票据兜住。
    location = /magpie {
        return 301 /magpie/;
    }

    # 入口：只处理 /magpie/ 本身（页面 HTML）。其它路径落到下面的前缀 location。
    location = /magpie/ {
        auth_request /_magpie_gate;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://$magpie_page/$magpie_entry_qs;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # magpie 换完 cookie 会重定向到 `/`（它以为自己在根上；真机实测 **303**，旧版是 302），
        # 改回子路径，否则会跳出管理面。nginx 的 proxy_redirect 对 301/302/303/307/308 一视同仁。
        # 反向也要防：Location 已经是 /magpie/… 时不要再加一层前缀（登录表单会带 back=/magpie/…）。
        proxy_redirect ~^/(?!magpie/)(.*)$ /magpie/$1;
        proxy_read_timeout 300s;
    }

    # 页面静态资源、页面自己的 /api/**、登录表单。逐个剥掉 /magpie 前缀转给 magpie。
    location /magpie/ {
        auth_request /_magpie_gate;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        rewrite ^/magpie/(.*)$ /$1 break;
        proxy_pass http://$magpie_page;
        proxy_http_version 1.1;
        # Host 必须原样转发：magpie 的页面 API 用 Origin/Sec-Fetch-Site 挡跨站写
        # （internal/gui/web.go 的 webOwnPage），Host 换成 magpie:3430 会让所有写请求 403。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^/(?!magpie/)(.*)$ /magpie/$1;
        proxy_read_timeout 300s;

        # 页面 JS 里写死了 fetch("/api/"+path)（绝对路径）。不做这一层改写，子路径挂载下
        # 页面的每个请求都会打到灵枢自己的 /api 上（401 一片）。代价：上游不能再 gzip
        # （sub_filter 只能改明文），改由本层 gzip 重新压缩；ETag 也要藏掉（内容已变）。
        proxy_set_header Accept-Encoding "";
        proxy_hide_header ETag;
        proxy_set_header If-None-Match "";
        sub_filter '"/api/' '"/magpie/api/';
        sub_filter 'action="/_magpie/sign-in"' 'action="/magpie/_magpie/sign-in"';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript;
    }

    # 只给 auth_request 用的内部子请求（external 打不到它）。
    # 票据在 cookie 里（`magpie_gate`），子请求会带上原始请求的 Cookie 头。
    location = /_magpie_gate {
        internal;
        proxy_pass http://$backend_upstream/internal/magpie-access/verify;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # /healthz（终表 #17）：白名单不含（不在 /v1/ 内、到不了 magpie）。默认维持现状；
    # 变更窗实测外网可达时才启用预案 B（方案 §5.3：allow 172.16/12 + 127/8 + deny all），
    # set_real_ip_from 已把外层反代还原成真实客户端 IP，allow/deny 按真实 IP 判定才正确。
    # 预案 B 配置（保持注释态，启用时替换本 location）：
    # location = /healthz {
    #     allow 172.16.0.0/12;
    #     allow 127.0.0.0/8;
    #     deny  all;
    #     proxy_pass http://$backend_upstream/healthz;
    # }
    location = /healthz {
        proxy_pass http://$backend_upstream/healthz;
    }

    # 带哈希指纹的构建产物可长缓存（add_header 不继承，需补安全头）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA 前端路由回退
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
