# 代理侧（magpie）管理面的页面口令注入规则 —— 镜像内的**默认值**（不注入）。
#
# 运行时由 docker-entrypoint.d/19-magpie-key.sh 用同一个路径覆盖成本：
#     map "$cookie_magpie_web_3430|$arg_k" $magpie_entry_qs {
#         "|"     "?k=<MAGPIE_WEB_KEY>";
#         default "";
#     }
#
# 为什么是 `map` 而不是 `set`：`map` 允许出现在 http 上下文（conf.d 就是 http 上下文），
# `set` 只能在 server/location 里；而 nginx 的 envsubst 模板机制会顺带替换配置里所有
# `$xxx`（如 $host、$uri），风险比生成一个小文件大得多。
#
# 为什么 cookie 名是 `magpie_web_3430`：magpie 的页面 cookie 名是 `magpie_web_<页面端口>`
# （internal/gui/web.go 的 webHandler），容器内的页面端口固定是 3430（compose 的 command）。
# 改了 magpie 的页面端口，这里也要跟着改 —— 否则每打开一次都会重新换一次口令（能进，但多一跳）。
#
# 为什么 `"|"` 才注入：没有 magpie 自己的 cookie、且用户也没手动带 ?k= 时，才由我们代填；
# 用户自己带了 k（比如排障）就原样交给 magpie 去判，免得「填错了反而进去了」。
#
# 口令长度：magpie 要求 MAGPIE_WEB_KEY **至少 16 字符**（短了它直接拒绝启动）。magpie-init 会把
# 不足的手填值补齐后写进卷里，19-magpie-key.sh 读的是**卷里那份**，长度不足 16 位时不再注入并告警。
map "$cookie_magpie_web_3430|$arg_k" $magpie_entry_qs {
    "|"     "";
    default "";
}
