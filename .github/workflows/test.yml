# 单元 / 集成测试。补齐此前缺失的测试 CI：
#   - 后端：起一次性 postgres 服务，设置 LLMGATEWAY_TEST_PG_DSN（迁移集成测试，自建临时库）
#     与 TEST_DATABASE_URL（e2e，用专用库 llmgw_test）。
#   - 必过闸 = go vet + 单元测试 + 迁移集成测试；e2e（tests/）单独作为「信息性」步骤（不阻断）——
#     该套件既有测试脚手架尚未装配渠道密钥服务等依赖，属历史遗留、从未在 CI 运行过，待其修复后再纳入必过闸。
#   - 前端：npm ci 后跑 vue-tsc 类型检查。
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (with Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llmgw
          POSTGRES_PASSWORD: llmgw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmgw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 迁移集成测试（internal/db）读它：以 postgres 库为管理连接，自建 llmgateway-test-* 临时库。
      LLMGATEWAY_TEST_PG_DSN: postgres://llmgw:llmgw@localhost:5432/postgres?sslmode=disable
      # e2e（tests/）读它：用专用库，e2e 会 DROP SCHEMA public CASCADE，与迁移测试彻底解耦。
      TEST_DATABASE_URL: postgres://llmgw:llmgw@localhost:5432/llmgw_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create dedicated e2e database
        run: |
          set -euo pipefail
          docker run --rm --network host postgres:16 \
            psql "postgresql://llmgw:llmgw@localhost:5432/postgres?sslmode=disable" \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE llmgw_test;'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # 必过闸：单元测试 + 迁移集成测试（internal/db，用 LLMGATEWAY_TEST_PG_DSN 自建临时库）。
      # 显式排除 tests/（e2e），其脚手架尚未装配渠道密钥服务等依赖，见下一步。
      - name: go test (unit + migrations, blocking)
        working-directory: backend
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -v '/tests$')
          go test -race $pkgs

      # 信息性：e2e 端到端套件。历史遗留、尚未 CI-ready（脚手架缺渠道密钥服务装配），
      # 故不阻断本流水线；失败细节可在日志中查看，待修复后并入上一步的必过闸。
      - name: go test e2e (informational, non-blocking)
        working-directory: backend
        continue-on-error: true
        run: go test ./tests/...

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx vue-tsc --noEmit
