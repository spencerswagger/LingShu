# 一键部署：前端 + 后端 + PostgreSQL + 代理侧（magpie）
#
#   docker compose up -d --build     # 启动（首次会构建前后端镜像）
#   docker compose logs -f backend   # 查看后端日志
#   docker compose down              # 停止（加 -v 连数据卷一起删除）
#
# 对外仅暴露 web 一个端口（默认 80，可用 APP_PORT 覆盖），前端静态资源与
# 管理端 /api、网关 /v1 均由 nginx 在同一端口下反代到后端。
# 后端启动时自动执行数据库迁移与初始管理员种子，无需手工操作。
#
# 代理侧（magpie）随 compose 自带，不需要手工配环境变量，端口/凭据/重置方式见
# docs/deploy/magpie-container.md：
#   - 网关 :3425 只在 compose 内网可达（backend → http://magpie:3425），不发布到宿主；
#   - 管理台 :3430 走灵枢同源的 /magpie/（nginx 反代 + ADMIN 票据，页面口令由 nginx 服务端代填），
#     宿主回环上的 3430 只是应急直连；
#   - 网关密钥与管理台口令首次 up 时自动生成并落在 magpie_secret 卷，三个容器读同一份。

services:
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/spencerswagger/library-postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmgw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmgw}
      POSTGRES_DB: ${POSTGRES_DB:-llmgw}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmgw} -d ${POSTGRES_DB:-llmgw}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 代理侧管理密钥自举（一次性任务，跑完即退出）。
  #
  # 为什么需要它：magpie 的网关密钥必须由 magpie 自己签发（值是 sk-magpie-key-…，
  # 由它的 /config 里的密钥库维护），我们无法凭空造一把双方都认的值。所以首次 up 时
  # 用同一个镜像、同一个 /config 卷，在网关启动之前建一把名为 ${MAGPIE_ADMIN_KEY_NAME:-lingshu-backend}
  # 的网关密钥，把值写进共享卷 magpie_secret；backend 启动时从该文件读取。
  # 之后每次 up 发现文件已存在就直接复用 —— 两边永远是同一把，无需人工填任何变量。
  magpie-init:
    # 镜像 tag 是**不带 v 前缀**的版本号（正确：0.1.4458；`v0.1.4458` 不存在，拉了会 404）。
    # 另有 latest / stable / daily 三个浮动 tag；这里钉具体版本，升级时改这两处（或写 MAGPIE_IMAGE）。
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:0.1.4458}
    user: "0:0" # 需要 chown 卷（magpie 以 uid 65532 运行）
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        KEY_FILE=/secret/admin_key
        WEB_KEY_FILE=/secret/admin_web_key
        NAME="$${MAGPIE_ADMIN_KEY_NAME:-lingshu-backend}"
        fix_owner() {
          chown -R 65532:65532 /config 2>/dev/null || true
          # 页面口令要能被 magpie（uid 65532）和 web/nginx（root）读；/secret 目录本身保持 700
          chown 65532:65532 /secret/admin_key /secret/admin_web_key 2>/dev/null || true
          chmod 600 /secret/admin_key /secret/admin_web_key 2>/dev/null || true
        }

        mkdir -p /secret /config
        chmod 700 /secret || true

        # 0) 页面口令（管理面 /magpie/ 入口由 nginx 代填，必须两边一致）—— 与网关密钥分开管：
        #    手填优先，其次复用卷里的，最后首次随机生成（32 位 hex，magpie 只接受字母数字与 - . _ ~）
        #
        #    长度是硬要求：magpie 要求 MAGPIE_WEB_KEY **至少 16 个字符**，短了它会直接拒绝启动
        #    （真机实测 13 位起不来）。所以手填值不足 16 位时在这里补齐（追加随机 hex）并告警——
        #    补齐后的值只存在卷里，magpie 与 nginx 都读这一份，口令本身不以 URL 形式进浏览器。
        gen_hex() {
          if command -v openssl >/dev/null 2>&1; then
            openssl rand -hex 16
          else
            head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n'
          fi
        }
        pad_web_key() { # 参数：原始口令。不足 16 位就追加随机 hex（只往长里补，不改已有字符）
          wk="$$1"
          if [ "$${#wk}" -ge 16 ]; then
            printf '%s' "$$wk"
            return 0
          fi
          echo "[magpie-init] 警告：管理面口令只有 $${#wk} 个字符，magpie 要求至少 16，已自动补齐（以卷里 /secret/admin_web_key 为准，请勿按原值手输）" >&2
          printf '%s%s' "$$wk" "$$(gen_hex)"
        }

        if [ -n "$${MAGPIE_WEB_KEY:-}" ]; then
          pad_web_key "$$MAGPIE_WEB_KEY" > "$$WEB_KEY_FILE"
          echo "[magpie-init] 使用环境变量 MAGPIE_WEB_KEY 作为管理面口令"
        elif [ -s "$$WEB_KEY_FILE" ]; then
          # 老部署可能留着不足 16 位的口令（magpie 会起不来）→ 就地补齐后覆写
          cur=$$(cat "$$WEB_KEY_FILE")
          if [ "$${#cur}" -lt 16 ]; then
            pad_web_key "$$cur" > "$$WEB_KEY_FILE"
          fi
          echo "[magpie-init] 复用已有管理面口令：$$WEB_KEY_FILE"
        else
          gen_hex > "$$WEB_KEY_FILE"
          echo "[magpie-init] 已生成管理面口令并写入 $$WEB_KEY_FILE"
        fi

        # 1) 显式给了 MAGPIE_ADMIN_KEY（手工在管理面建好不可恢复的 key）→ 以环境变量为准
        if [ -n "$${MAGPIE_ADMIN_KEY:-}" ]; then
          printf '%s' "$$MAGPIE_ADMIN_KEY" > "$$KEY_FILE"
          chmod 600 "$$KEY_FILE" || true
          fix_owner
          echo "[magpie-init] 使用环境变量 MAGPIE_ADMIN_KEY（不自动生成）"
          exit 0
        fi

        # 2) 已经生成过 → 复用（卷还在就永不重生成，两个容器的值因此始终一致）
        if [ -s "$$KEY_FILE" ]; then
          fix_owner
          echo "[magpie-init] 复用已有管理密钥：$$KEY_FILE"
          exit 0
        fi

        # 3) 首次：在 magpie 的配置里建一把网关密钥（Docker 模式下不需要开 sharing）
        out=$$(magpie gateway-key add "$$NAME" 2>&1) || true
        key=$$(printf '%s\n' "$$out" | grep -o 'sk-magpie-key-[A-Za-z0-9._-]*' | head -n 1 || true)
        if [ -z "$$key" ]; then
          fix_owner
          echo "[magpie-init] 自动创建网关密钥失败，转发与拓扑/账本同步会拿不到凭据。" >&2
          printf '%s\n' "$$out" >&2
          echo "[magpie-init] 兜底（二选一）：" >&2
          echo "  a) 稍后重跑：docker compose up -d" >&2
          echo "  b) 打开 http://127.0.0.1:$${MAGPIE_UI_PORT:-3430}/ 建一把 key，" >&2
          echo "     写进 .env 的 MAGPIE_ADMIN_KEY=<key> 后 docker compose up -d" >&2
          exit 0
        fi
        printf '%s' "$$key" > "$$KEY_FILE"
        chmod 600 "$$KEY_FILE" || true
        fix_owner
        echo "[magpie-init] 已创建网关密钥 $$NAME 并写入 $$KEY_FILE"
    environment:
      MAGPIE_ADMIN_KEY: ${MAGPIE_ADMIN_KEY:-}
      MAGPIE_ADMIN_KEY_NAME: ${MAGPIE_ADMIN_KEY_NAME:-lingshu-backend}
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      MAGPIE_UI_PORT: ${MAGPIE_UI_PORT:-3430}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - magpie_config:/config
      - magpie_secret:/secret

  # 代理侧：选渠道、failover、四协议互译都在这里；灵枢只做 facade。
  magpie:
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:0.1.4458} # 同上：tag 无 v 前缀
    # web 子命令 = 网关 + 浏览器管理面；管理面同时应答 /v1 路由。
    # 页面口令由 magpie-init 落在 magpie_secret 卷里，这里在进程启动前读进环境变量
    # （magpie 只认环境变量，没有「从文件读口令」的开关），这样重启不会换口令，
    # nginx 那边注入的也永远是同一把。
    #
    # 取值顺序是**卷优先**（不是环境变量优先）：magpie-init 已经把手填的短口令补齐到 16 位
    # 以上，只认卷里那份，才能保证 magpie 与 nginx 用的是同一把（否则环境变量里的短口令
    # 会让 magpie 直接起不来，而 nginx 注入的是补齐后的值）。
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ -s /secret/admin_web_key ]; then
          MAGPIE_WEB_KEY=$$(cat /secret/admin_web_key)
          export MAGPIE_WEB_KEY
          echo "[magpie] 管理面口令来自 /secret/admin_web_key" >&2
        elif [ -n "$${MAGPIE_WEB_KEY:-}" ]; then
          echo "[magpie] 管理面口令来自环境变量 MAGPIE_WEB_KEY" >&2
        else
          echo "[magpie] 未取到管理面口令：magpie 会自行生成一个随机值（每次重启都会变，/magpie/ 入口需手工粘贴）" >&2
        fi
        # magpie 要求口令至少 16 个字符，短了它会拒绝启动。这里不改值（改了 nginx 就对不上），
        # 只把原因喊出来，免得只看到一行 "web key too short" 不知所措。
        if [ -n "$${MAGPIE_WEB_KEY:-}" ] && [ "$${#MAGPIE_WEB_KEY}" -lt 16 ]; then
          echo "[magpie] 警告：管理面口令只有 $${#MAGPIE_WEB_KEY} 个字符，magpie 要求至少 16，会拒绝启动；清空 .env 的 MAGPIE_WEB_KEY 让 magpie-init 重新生成（或填 >=16 位）" >&2
        fi
        exec magpie web --addr 0.0.0.0:3430 --no-open
    environment:
      # 网关端口（容器内固定 3425；不发布到宿主，只有 compose 内网能到）
      MAGPIE_ADDR: 0.0.0.0:3425
      # 手工固定口令时才填（留空 = 用 magpie_secret 卷里那份，见 docs/deploy/magpie-container.md）
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      MAGPIE_NAME: ${MAGPIE_NAME:-lingshu-magpie}
      # 刻意不设 MAGPIE_TRUST_PROXY：它按「有没有转发头」判定请求是不是本地，
      # 开了之后 nginx 转来的 /v1 会被当成本地（免网关密钥）。详见
      # docs/designs/2026-11-18-magpie-compose-and-admin-jump.md §1.3。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 应急直连（break-glass）：只绑宿主机回环，仍需 magpie 自己的页面口令。
      # 日常入口是灵枢同源的 https://<灵枢地址>/magpie/（ADMIN 票据 + auth_request），
      # 不走这里；排障时（例如 nginx 挂了）才用它。不需要就删掉这一行。
      - "127.0.0.1:${MAGPIE_UI_PORT:-3430}:3430"
    volumes:
      - magpie_config:/config # providers / 网关密钥 / 登录态 / 用量（含明文上游凭据，按密钥卷对待）
      - magpie_secret:/secret:ro # admin_web_key：管理面口令（magpie-init 生成，这里只读）
    healthcheck:
      test: ["CMD", "magpie", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      magpie-init:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      # 数据库连接（默认指向本 compose 内的 postgres）
      DATABASE_URL: postgres://${POSTGRES_USER:-llmgw}:${POSTGRES_PASSWORD:-llmgw}@postgres:5432/${POSTGRES_DB:-llmgw}?sslmode=disable
      # 留空则首次启动自动生成强随机 SM4 密钥并持久化到 backend_keys 卷
      SM4_KEY: ${SM4_KEY:-}
      # 代理侧基址：默认指向 compose 内的 magpie 服务，无需手填
      MAGPIE_BASE_URL: ${MAGPIE_BASE_URL:-http://magpie:3425}
      # 代理侧管理密钥：留空表示读 magpie-init 生成的那份（entrypoint 会从
      # /run/magpie-secret/admin_key 取），因此两边永远是同一把；只有「手工在管理面
      # 建 key」的场景才需要在这里填。
      MAGPIE_ADMIN_KEY: ${MAGPIE_ADMIN_KEY:-}
      # 账本变更流：同一个代理侧、同一把网关密钥（entrypoint 会把两者对齐）
      UPSTREAM_LEDGER_URL: ${UPSTREAM_LEDGER_URL:-http://magpie:3425}
      UPSTREAM_ADMIN_KEY: ${UPSTREAM_ADMIN_KEY:-}
      # 可信代理网段（逗号分隔 CIDR）：仅当直连对端属于这些网段时才采信 X-Real-IP。
      # 代码默认只信任回环；此处显式声明本 compose 网络（docker 默认从 172.16/12 分配）。
      # 若实际网络落在其他段（如 192.168/16），请用 `docker network inspect` 查明后覆盖，
      # 否则审计 ip 会退化为 nginx 容器 IP、限流的 IP 维度也会退化。
      # 注意：backend 不得暴露对外端口（限流/审计依赖此信任边界）。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # 登录令牌有效期（分钟）：与后端常量 config.DefaultJWTTTLMinutes 及 README 保持一致
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-360}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_keys:/app/keys # JWT RSA 密钥对 + SM4 密钥
      - backend_data:/app/data # 账单重试队列（WAL）
      - magpie_secret:/run/magpie-secret:ro # 代理侧管理密钥（只读，只放这一把）
    depends_on:
      postgres:
        condition: service_healthy
      # 只等「启动」不等「健康」：magpie 起不来时后端仍要能提供管理面，
      # 转发接口会返回 503，拓扑同步会在 10 分钟后再试（也可手动触发）。
      magpie:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # 代理侧管理面（/magpie/）的页面口令：留空则读 magpie_secret 卷里的 admin_web_key
      # （magpie-init 首次 up 时自动生成，与 magpie 自己用的是同一把）。
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      MAGPIE_WEB_KEY_FILE: /run/magpie-secret/admin_web_key
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 只读：nginx 启动时把页面口令编译成一个 map 文件，用于 /magpie/ 入口的服务端注入。
      # 代价要说清：web 容器因此持有页面口令（它能开代理侧管理面）——只跑 nginx，不挂别的卷。
      - magpie_secret:/run/magpie-secret:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  backend_keys:
  backend_data:
  magpie_config: # magpie 自己的配置/密钥/登录态/用量
  magpie_secret: # 两把：网关密钥 admin_key（backend 读）+ 管理台口令 admin_web_key（magpie/web 读）
