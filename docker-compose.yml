# 一键部署：前端 + 后端 + PostgreSQL
#
#   docker compose up -d --build     # 启动（首次会构建前后端镜像）
#   docker compose logs -f backend   # 查看后端日志
#   docker compose down              # 停止（加 -v 连数据卷一起删除）
#
# 对外仅暴露 web 一个端口（默认 80，可用 APP_PORT 覆盖），前端静态资源与
# 管理端 /api、网关 /v1 均由 nginx 在同一端口下反代到后端。
# 后端启动时自动执行数据库迁移与初始管理员种子，无需手工操作。

services:
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/spencerswagger/library-postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmgw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmgw}
      POSTGRES_DB: ${POSTGRES_DB:-llmgw}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmgw} -d ${POSTGRES_DB:-llmgw}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      # 数据库连接（默认指向本 compose 内的 postgres）
      DATABASE_URL: postgres://${POSTGRES_USER:-llmgw}:${POSTGRES_PASSWORD:-llmgw}@postgres:5432/${POSTGRES_DB:-llmgw}?sslmode=disable
      # 留空则首次启动自动生成强随机 SM4 密钥并持久化到 backend_keys 卷
      SM4_KEY: ${SM4_KEY:-}
      # 可信代理网段（逗号分隔 CIDR）：仅当直连对端属于这些网段时才采信 X-Real-IP。
      # 代码默认只信任回环；此处显式声明本 compose 网络（docker 默认从 172.16/12 分配）。
      # 若实际网络落在其他段（如 192.168/16），请用 `docker network inspect` 查明后覆盖，
      # 否则审计 ip 会退化为 nginx 容器 IP、限流的 IP 维度也会退化。
      # 注意：backend 不得暴露对外端口（限流/审计依赖此信任边界）。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_keys:/app/keys # JWT RSA 密钥对 + SM4 密钥
      - backend_data:/app/data # 账单重试队列（WAL）
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  backend_keys:
  backend_data: