# 一键部署：前端 + 后端 + PostgreSQL + 代理侧（magpie）
#
# 部署机**只拉镜像、不构建**：前后端镜像由 GitHub Actions
# （.github/workflows/build-images.yml）在打 tag 时构建并推到 ACR。
#
#   docker compose up -d             # 启动（拉镜像 + 起容器，首次会自动建库/迁移/种子）
#   docker compose logs -f backend   # 查看后端日志
#   docker compose down              # 停止（加 -v 连数据卷一起删除）
#
# 升级 = 改 LINGSHU_IMAGE_TAG（或改下面两处 image: 的默认 tag）→ `docker compose up -d`。
# 需要在部署机上用源码自己构建时，叠加 docker-compose.build.yml（默认不用）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#
# 整套只需要本文件（可选 .env）与数据卷，**不依赖仓库源码目录**：后端二进制、
# 迁移 SQL、前端静态资源、启动脚本都在镜像里，密钥与数据在卷里。
#
# 对外仅暴露 web 一个端口（默认 80，可用 APP_PORT 覆盖），前端静态资源与
# 管理端 /api、网关 /v1 均由 nginx 在同一端口下反代到后端。
# 后端启动时自动执行数据库迁移与初始管理员种子，无需手工操作。
#
# 代理侧（magpie）随 compose 自带，不需要手工配环境变量，端口/凭据/重置方式见
# docs/deploy/magpie-container.md：
#   - 网关 :3425 只在 compose 内网可达（backend → http://magpie:3425），不发布到宿主；
#   - 管理台 :3430 走灵枢同源的 /magpie/（nginx 反代 + ADMIN 票据，页面口令由 nginx 服务端代填），
#     宿主回环上的 3430 只是应急直连；
#   - 网关密钥与管理台口令首次 up 时自动生成并落在 magpie_secret 卷，三个容器读同一份。

services:
  postgres:
    image: registry.cn-hangzhou.aliyuncs.com/spencerswagger/library-postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmgw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmgw}
      POSTGRES_DB: ${POSTGRES_DB:-llmgw}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmgw} -d ${POSTGRES_DB:-llmgw}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 页面口令预置（一次性任务，magpie 启动前跑）：保证 magpie 起来时 /secret/admin_web_key
  # 已存在且 >=16 位，避免每次重启 magpie 自己随机换一个页面口令。只做文件与权限，不碰 CLI。
  magpie-secret-init:
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:0.1.4458}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/lingshu/magpie-secret-init.sh"]
    # 脚本在 ./deploy/compose-scripts/ 下，只读挂进容器；改脚本不用改 compose。
    # 部署机没跟着下载这些脚本时，compose 起不来（见 docs/deploy/magpie-container.md）。
    environment:
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - magpie_config:/config
      - magpie_secret:/secret
      - ./deploy/compose-scripts:/opt/lingshu:ro

  # 代理侧管理密钥自举 + 自愈。
  #
  # 为什么必须「等 magpie 起来之后再校验」：magpie 首次启动会迁移/导入旧配置
  # （settings.json + caller-keys.json），这个过程可能把先前生成的网关密钥顶掉，
  # 表现为灵枢同步时报 401「key ... is not an enabled magpie gateway key」。
  # 所以这一步不是「启动前建一把就走」，而是「magpie healthy 之后，用真实请求
  # 验一次 /v1/models：通了就复用；401/404 就重建一把并回写共享卷」。
  # backend 等这一步成功后才启动，因此它读到的密钥一定是当前 magpie 认的。
  magpie-init:
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:0.1.4458}
    user: "0:0"
    restart: "no"
    depends_on:
      magpie:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/lingshu/magpie-key-init.sh"]
    # 脚本在 ./deploy/compose-scripts/ 下，只读挂进容器；改脚本不用改 compose。
    # 部署机没跟着下载这些脚本时，compose 起不来（见 docs/deploy/magpie-container.md）。
    environment:
      MAGPIE_ADMIN_KEY: ${MAGPIE_ADMIN_KEY:-}
      MAGPIE_ADMIN_KEY_NAME: ${MAGPIE_ADMIN_KEY_NAME:-lingshu-backend}
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      MAGPIE_ADDR: http://magpie:3425
      MAGPIE_UI_PORT: ${MAGPIE_UI_PORT:-3430}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - magpie_config:/config
      - magpie_secret:/secret
      - ./deploy/compose-scripts:/opt/lingshu:ro

  # 代理侧：选渠道、failover、四协议互译都在这里；灵枢只做 facade。
  magpie:
    image: ${MAGPIE_IMAGE:-ghcr.io/yetone/magpie:0.1.4458} # 同上：tag 无 v 前缀
    # web 子命令 = 网关 + 浏览器管理面；管理面同时应答 /v1 路由。
    # 页面口令由 magpie-secret-init 落在 magpie_secret 卷里，这里在进程启动前读进环境变量
    # （magpie 只认环境变量，没有「从文件读口令」的开关），这样重启不会换口令，
    # nginx 那边注入的也永远是同一把。
    #
    # 取值顺序是**卷优先**（不是环境变量优先）：magpie-init 已经把手填的短口令补齐到 16 位
    # 以上，只认卷里那份，才能保证 magpie 与 nginx 用的是同一把（否则环境变量里的短口令
    # 会让 magpie 直接起不来，而 nginx 注入的是补齐后的值）。
    entrypoint: ["/bin/bash", "/opt/lingshu/magpie-web-start.sh"]
    environment:
      # 网关端口（容器内固定 3425；不发布到宿主，只有 compose 内网能到）
      MAGPIE_ADDR: 0.0.0.0:3425
      # 手工固定口令时才填（留空 = 用 magpie_secret 卷里那份，见 docs/deploy/magpie-container.md）
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      MAGPIE_NAME: ${MAGPIE_NAME:-lingshu-magpie}
      # 刻意不设 MAGPIE_TRUST_PROXY：它按「有没有转发头」判定请求是不是本地，
      # 开了之后 nginx 转来的 /v1 会被当成本地（免网关密钥）。详见
      # docs/designs/2026-11-18-magpie-compose-and-admin-jump.md §1.3。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 管理面端口：默认绑所有网卡（0.0.0.0），方便在别的机器上打开。仍需 magpie 页面口令（>=16 位）。
      # 只要本机访问就设 MAGPIE_UI_BIND=127.0.0.1。
      - "${MAGPIE_UI_BIND:-0.0.0.0}:${MAGPIE_UI_PORT:-3430}:3430"
      # 网关端口：默认也发布出来（调用方仍需网关密钥，没有 key 一律 401）。
      # 不想对外可设 MAGPIE_GW_BIND=127.0.0.1 或删掉这一行。
      - "${MAGPIE_GW_BIND:-0.0.0.0}:${MAGPIE_GW_PORT:-3425}:3425"
    volumes:
      - magpie_config:/config # providers / 网关密钥 / 登录态 / 用量（含明文上游凭据，按密钥卷对待）
      - magpie_secret:/secret:ro # admin_web_key：管理面口令（magpie-secret-init 生成，这里只读）
      - ./deploy/compose-scripts:/opt/lingshu:ro
    healthcheck:
      test: ["CMD", "magpie", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      magpie-secret-init:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    # 镜像来自 ACR（GitHub Actions 打 tag 时构建推送），部署机不构建。
    # 升级：只改 LINGSHU_IMAGE_TAG（或这行的默认值）；本地构建见 docker-compose.build.yml。
    image: ${LINGSHU_REGISTRY:-registry.cn-hangzhou.aliyuncs.com/spencerswagger}/lingshu-backend:${LINGSHU_IMAGE_TAG:-v0.14.0-rc8}
    environment:
      # 数据库连接（默认指向本 compose 内的 postgres）
      DATABASE_URL: postgres://${POSTGRES_USER:-llmgw}:${POSTGRES_PASSWORD:-llmgw}@postgres:5432/${POSTGRES_DB:-llmgw}?sslmode=disable
      # 留空则首次启动自动生成强随机 SM4 密钥并持久化到 backend_keys 卷
      SM4_KEY: ${SM4_KEY:-}
      # 代理侧基址：默认指向 compose 内的 magpie 服务，无需手填
      MAGPIE_BASE_URL: ${MAGPIE_BASE_URL:-http://magpie:3425}
      # 代理侧管理密钥：留空表示读 magpie-init 生成的那份（entrypoint 会从
      # /run/magpie-secret/admin_key 取），因此两边永远是同一把；只有「手工在管理面
      # 建 key」的场景才需要在这里填。
      MAGPIE_ADMIN_KEY: ${MAGPIE_ADMIN_KEY:-}
      # 账本变更流：同一个代理侧、同一把网关密钥（entrypoint 会把两者对齐）
      UPSTREAM_LEDGER_URL: ${UPSTREAM_LEDGER_URL:-http://magpie:3425}
      UPSTREAM_ADMIN_KEY: ${UPSTREAM_ADMIN_KEY:-}
      # 可信代理网段（逗号分隔 CIDR）：仅当直连对端属于这些网段时才采信 X-Real-IP。
      # 代码默认只信任回环；此处显式声明本 compose 网络（docker 默认从 172.16/12 分配）。
      # 若实际网络落在其他段（如 192.168/16），请用 `docker network inspect` 查明后覆盖，
      # 否则审计 ip 会退化为 nginx 容器 IP、限流的 IP 维度也会退化。
      # 注意：backend 不得暴露对外端口（限流/审计依赖此信任边界）。
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # 登录令牌有效期（分钟）：与后端常量 config.DefaultJWTTTLMinutes 及 README 保持一致
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-360}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend_keys:/app/keys # JWT RSA 密钥对 + SM4 密钥
      - backend_data:/app/data # 账单重试队列（WAL）
      - magpie_secret:/run/magpie-secret:ro # 代理侧管理密钥（只读，只放这一把）
    depends_on:
      postgres:
        condition: service_healthy
      # 等密钥自举成功再起：保证后端启动时读到的代理侧密钥一定是当前 magpie 认的。
      magpie-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    # 同 backend：镜像来自 ACR，部署机不构建（本地构建见 docker-compose.build.yml）。
    image: ${LINGSHU_REGISTRY:-registry.cn-hangzhou.aliyuncs.com/spencerswagger}/lingshu-web:${LINGSHU_IMAGE_TAG:-v0.14.0-rc8}
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # 代理侧管理面（/magpie/）的页面口令：留空则读 magpie_secret 卷里的 admin_web_key
      # （magpie-init 首次 up 时自动生成，与 magpie 自己用的是同一把）。
      MAGPIE_WEB_KEY: ${MAGPIE_WEB_KEY:-}
      MAGPIE_WEB_KEY_FILE: /run/magpie-secret/admin_web_key
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 只读：nginx 启动时把页面口令编译成一个 map 文件，用于 /magpie/ 入口的服务端注入。
      # 代价要说清：web 容器因此持有页面口令（它能开代理侧管理面）——只跑 nginx，不挂别的卷。
      - magpie_secret:/run/magpie-secret:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  backend_keys:
  backend_data:
  magpie_config: # magpie 自己的配置/密钥/登录态/用量
  magpie_secret: # 两把：网关密钥 admin_key（backend 读）+ 管理台口令 admin_web_key（magpie/web 读）
